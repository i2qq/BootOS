set default="0"
set timeout=5

# Entry 1: Direct boot from extracted files on USB
menuentry "BootOS (100% DRAM Mode - Fast Boot)" {
    search --no-floppy --set=root --file /boot/vmlinuz
    linux /boot/vmlinuz console=tty0 console=tty1 init=/init lockdown=none
    initrd /boot/initramfs.gz
}

# Entry 2: Loopback boot from bootos.iso copied via File Manager
menuentry "BootOS (Execute bootos.iso in DRAM)" {
    search --no-floppy --set=root --file /bootos.iso
    loopback loop ($root)/bootos.iso
    linux (loop)/boot/vmlinuz console=tty0 console=tty1 init=/init lockdown=none
    initrd (loop)/boot/initramfs.gz
}

menuentry "BootOS (Quiet Mode)" {
    search --no-floppy --set=root --file /boot/vmlinuz
    linux /boot/vmlinuz quiet console=tty0 console=tty1 init=/init lockdown=none
    initrd /boot/initramfs.gz
}
